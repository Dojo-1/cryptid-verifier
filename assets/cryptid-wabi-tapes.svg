<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">cryptid-verifier — every machine leaves a trace</title>
<desc id="art-desc">Original Wabi-Futurist artwork. Four schematic binary Turing-machine tapes, one each for Antihydra, A.4, A.9 and L17, sit against fine woven threads in warm ivory on obsidian. Three have a check-like mark for a proven conditional reduction, while L17 bears one vermilion open boundary. Tape digits are purely illustrative and do not encode real machine traces or halting proofs.</desc>
