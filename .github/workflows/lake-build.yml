name: lake build

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
          # The audit needs the `#print axioms` output; if nothing was compiled, rebuild from scratch.
          if ! grep -q "depends on axioms" build.log; then
            rm -rf .lake/build
            lake build 2>&1 | tee build.log
          fi
      - name: Trust audit
        run: python3 scripts/audit_trust.py build.log
      - name: Evidence smoke test (transcriptions vs raw Turing machines)
        run: python3 analysis/scripts/smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical-check dependency
        run: python3 -m pip install numpy
      - name: Exact acceleration and finite-evidence regression checks
        run: python3 -m unittest discover -s analysis/scripts -p 'test_*.py' -v
      - name: Appendix C lead screen checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/appendix-c-leads -p 'test_pipeline.py' -v
      - name: L17 stacked-section checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-stacked-section -p 'test_stacked.py' -v
      - name: L17 hardening harness checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-hardening -p 'test_hardening.py' -v
      - name: L17 stack checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-stack -p 'test_stack.py' -v

  mathlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: mathlib
        run: lake exe cache get
      - name: Build
        working-directory: mathlib
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
      - name: Trust audit
        working-directory: mathlib
        run: python3 ../scripts/audit_trust.py build.log

  link:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        working-directory: link
        run: lake exe cache get
      - name: Build (links to google-deepmind/cryptids machine-level proofs)
        working-directory: link
        run: |
          set -o pipefail
          # upstream elaborates data files by paths relative to the build directory
          ln -sfn .lake/packages/Cryptids/baselines baselines
          ln -sfn .lake/packages/Cryptids/artifacts artifacts
          lake build 2>&1 | tee build.log
      - name: Trust audit
        working-directory: link
        run: python3 ../scripts/audit_trust.py build.log
