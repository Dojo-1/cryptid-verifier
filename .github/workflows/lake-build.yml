name: lake build

on:
  push:
  pull_request:

jobs:
  tooling:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Trust gate, generation and runner failure controls
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  lean:
    strategy:
      fail-fast: false
      matrix:
        project: [core, mathlib, link]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare, build and audit the selected project
        run: python scripts/verify.py --project ${{ matrix.project }}
      - name: Archive generated L17 proof sources and build log
        if: always() && matrix.project == 'link'
        uses: actions/upload-artifact@v4
        with:
          name: l17-orbit
          path: |
            link/CryptidLink/Generated/*.lean
            link/generated-orbit.json
            link/build.log

  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evidence smoke test (transcriptions vs raw Turing machines)
        run: python3 analysis/scripts/smoke.py
      - name: Install numerical-check dependency
        run: python3 -m pip install numpy
      - name: Exact acceleration and finite-evidence regression checks
        run: python3 -m unittest discover -s analysis/scripts -p 'test_*.py' -v
      - name: Appendix C lead screen checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/appendix-c-leads -p 'test_pipeline.py' -v
      - name: L17 stacked-section checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-stacked-section -p 'test_stacked.py' -v
      - name: Build literal comparator for the hardening regression
        run: g++ -std=c++17 -O2 analysis/l17-hardening/raw_comparator.cpp -o analysis/l17-hardening/comparator-O2
      - name: L17 hardening harness checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-hardening -p 'test_hardening.py' -v
      - name: L17 stack checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-stack -p 'test_stack.py' -v
      - name: L17 return-section checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-return-section -p 'test_return.py' -v
      - name: L17 collapse checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-collapse -p 'test_collapse.py' -v
      - name: L17 general-D checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-general-d -p 'test_general_d.py' -v
      - name: L17 contextual stepper vs literal machine
        run: python3 -m unittest discover -s analysis/leads -p 'test_l17_ctx.py' -v
      - name: L17 opposite-stream frame checks (GPT contribution)
        run: python3 -m unittest discover -s analysis/l17-frames -p 'test_frames.py' -v
